app:
  description: ERP AI 助手 - 思考模式（R1 推理）/ 普通模式（V3 快答）双模型分流
  icon: 💬
  icon_background: '#FEF7C3'
  icon_type: emoji
  mode: advanced-chat
  name: ERP AI 助手
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/deepseek:0.0.17@f7a5c1d222d17ee419b17a80d6e4923838fe93788dc724a3af73fbc6990b3a32
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 你好，我是 ERP AI 助手 ✨ 有什么可以帮你的吗？
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    # 开始 → IF/ELSE
    - id: start-to-ifelse
      source: '1776072202913'
      sourceHandle: source
      target: ifelse_node
      targetHandle: target
      type: custom
      data:
        sourceType: start
        targetType: if-else
    # IF/ELSE 真分支 → R1 推理 LLM
    - id: ifelse-true-to-llm-reasoning
      source: ifelse_node
      sourceHandle: 'true'
      target: llm_reasoning
      targetHandle: target
      type: custom
      data:
        sourceType: if-else
        targetType: llm
    # IF/ELSE 假分支 → V3 普通 LLM
    - id: ifelse-false-to-llm-normal
      source: ifelse_node
      sourceHandle: 'false'
      target: llm_normal
      targetHandle: target
      type: custom
      data:
        sourceType: if-else
        targetType: llm
    # R1 → 直接回复
    - id: llm-reasoning-to-answer
      source: llm_reasoning
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      data:
        sourceType: llm
        targetType: answer
    # V3 → 直接回复
    - id: llm-normal-to-answer
      source: llm_normal
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      data:
        sourceType: llm
        targetType: answer
    nodes:
    # ── 开始节点：声明 thinking_mode 变量 ──
    - id: '1776072202913'
      type: custom
      position:
        x: 100
        y: 300
      positionAbsolute:
        x: 100
        y: 300
      width: 242
      height: 116
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        title: 用户输入
        type: start
        desc: 接收用户消息和 thinking_mode 思考模式开关。
        selected: false
        variables:
        - label: 思考模式
          variable: thinking_mode
          type: select
          required: false
          default: 'off'
          max_length: 0
          options: []
          options_v2:
          - label: 关闭（普通对话，DeepSeek-V3）
            value: 'off'
          - label: 开启（深度思考，DeepSeek-R1）
            value: 'on'
          hint: 由前端 inputs 字段透传；on 走 R1 推理模型，off 走 V3 快答模型
    # ── IF/ELSE 条件分支 ──
    - id: ifelse_node
      type: custom
      position:
        x: 400
        y: 300
      positionAbsolute:
        x: 400
        y: 300
      width: 242
      height: 154
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        title: 思考模式分流
        type: if-else
        desc: thinking_mode == 'on' 走 R1 推理；否则走 V3 快答。
        selected: false
        logical_operator: and
        cases:
        - case_id: 'true'
          logical_operator: and
          conditions:
          - id: cond-thinking-on
            comparison_operator: is
            value: 'on'
            varType: string
            variable_selector:
            - '1776072202913'
            - thinking_mode
    # ── 真分支：R1 推理模型 ──
    - id: llm_reasoning
      type: custom
      position:
        x: 720
        y: 160
      positionAbsolute:
        x: 720
        y: 160
      width: 242
      height: 131
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        title: 深度思考（R1）
        type: llm
        desc: DeepSeek-R1 推理模型，自动输出 <think>...</think> 包裹的推理过程。
        selected: false
        context:
          enabled: false
          variable_selector: []
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 10
        model:
          completion_params:
            temperature: 0.6
          mode: chat
          name: deepseek-reasoner
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: prompt-reasoning-system
          role: system
          text: |-
            # 角色

            你是 ERP 系统的专业 AI 助手"小韩"。当前处于【深度思考】模式，请充分发挥推理能力，给出经过深思熟虑的高质量回答。

            # 任务

            针对用户的问题（ERP 业务咨询、数据分析、操作指引、复杂决策、通用问题等），先在内部完成完整推理，再给出最终答案。

            # 回答规范

            - 复杂内容用要点 / 编号 / 表格拆解
            - 涉及数据 / 操作时，确保信息准确，不确定时坦诚告知
            - 代码用 Markdown 代码块并标注语言
            - 中文中英文 / 数字间留半角空格，例如"使用 Vue3 框架"
            - 答案简洁、可执行
        vision:
          enabled: false
    # ── 假分支：V3 普通快答 ──
    - id: llm_normal
      type: custom
      position:
        x: 720
        y: 440
      positionAbsolute:
        x: 720
        y: 440
      width: 242
      height: 131
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        title: 快速回答（V3）
        type: llm
        desc: DeepSeek-V3 / V4-Flash 普通模型，秒级回答，不输出 think 标签。
        selected: false
        context:
          enabled: false
          variable_selector: []
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: true
            size: 10
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: deepseek-chat
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: prompt-normal-system
          role: system
          text: |-
            # 角色

            你是 ERP 系统的专业 AI 助手"小韩"。

            # 任务

            针对用户的问题，给出准确、条理清晰、简洁易懂的回答。

            # 语气

            友好、客观、中立。

            # 回答规范

            - 复杂内容用要点 / 编号 / 表格拆解
            - 涉及数据 / 操作时，确保信息准确，不确定时坦诚告知
            - 代码用 Markdown 代码块并标注语言
            - 中文中英文 / 数字间留半角空格，例如"使用 Vue3 框架"
            - 简洁，避免冗长铺垫
            - **绝对不要输出 <think> 或任何 HTML 标签包裹的内容**
        vision:
          enabled: false
    # ── 直接回复（两个 LLM 都汇入这里）──
    - id: answer
      type: custom
      position:
        x: 1080
        y: 300
      positionAbsolute:
        x: 1080
        y: 300
      width: 242
      height: 146
      sourcePosition: right
      targetPosition: left
      selected: false
      data:
        title: 直接回复
        type: answer
        desc: 把上游 LLM 的输出原样返回（含可选的 <think> 标签）。
        selected: false
        answer: '{{#llm_reasoning.text#}}{{#llm_normal.text#}}'
        variables: []
    viewport:
      x: 0
      y: 0
      zoom: 0.8
  rag_pipeline_variables: []
